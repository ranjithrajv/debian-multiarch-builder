name: 'Debian Multi-Architecture Package Builder'
description: 'Build Debian packages for multiple architectures from upstream releases'
author: 'ranjithrajv'

branding:
  icon: 'package'
  color: 'red'

inputs:
  config-file:
    description: 'Path to the multiarch configuration YAML file'
    required: true
  version:
    description: 'Version of the software to build'
    required: true
  build-version:
    description: 'Debian build version number'
    required: true
  architecture:
    description: 'Architecture to build (amd64, arm64, armel, armhf, ppc64el, s390x, riscv64, or "all")'
    required: false
    default: 'all'
  max-parallel:
    description: 'Maximum number of parallel builds (default: 4, recommended: 2-4 for GitHub runners)'
    required: false
    default: '4'
  lintian-check:
    description: 'Enable Lintian check for Debian packages'
    required: false
    default: 'false'
  telemetry-enabled:
    description: 'Enable enhanced build telemetry and metrics collection'
    required: false
    default: 'true'
  save-baseline:
    description: 'Save current build metrics as performance baseline for regression detection'
    required: false
    default: 'false'
  pinned-metadata:
    description: 'Path to a release-metadata.json provenance pin (captured at vet time). When set and the release matches the vetted version, downloaded upstream assets are verified against the pinned SHA-256 and a mismatch fails the build.'
    required: false
    default: ''
  
outputs:
  packages:
    description: 'List of generated .deb package files'
    value: ${{ steps.build.outputs.packages }}

runs:
  using: 'composite'
  steps:
    - name: Install minimal dependencies for validation
      shell: bash
      run: |
        # Install only what's needed for version validation
        sudo apt-get update
        sudo apt-get install -y curl

    - name: Validate version availability
      shell: bash
      run: |
        echo "🔍 Checking if version ${{ inputs.version }} exists..."

        # Basic validation without yq (since it's not installed yet)
        if [ ! -f "${{ inputs.config-file }}" ]; then
          echo "❌ Configuration file not found: ${{ inputs.config-file }}"
          exit 1
        fi

        # Extract GitHub repo from config file using basic grep/sed
        GITHUB_REPO=$(grep "github_repo:" "${{ inputs.config-file }}" | sed 's/.*github_repo: *["'\'']\? *//;s/["'\''] *$//' 2>/dev/null || echo "")

        if [ -z "$GITHUB_REPO" ]; then
          echo "⚠️  Warning: Could not determine GitHub repo from config, skipping version validation"
          echo "    Expected format in config: github_repo: \"owner/repo\""
        else
          echo "📋 Validating version ${{ inputs.version }} for $GITHUB_REPO..."

          # Check if version exists using GitHub API. Authenticate when a
          # token is available - anonymous calls from shared GitHub Actions
          # runner IPs share a 60/hour rate limit across every workflow on
          # that IP, which this org's growing build volume exhausts easily,
          # misreporting real releases as "does not exist".
          # EXCEPTION (learned the hard way via aquasecurity/trivy): orgs
          # with an IP allow list 403 EVERY authenticated API request from
          # GitHub-hosted runner IPs ("correct authorization credentials,
          # but ... IP address is not permitted"). On a failed authenticated
          # check, retry tokenless - anonymous reads of PUBLIC release data
          # are served to any IP - before declaring the version missing.
          AUTH_HEADER=()
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            AUTH_HEADER=(-H "Authorization: token ${GITHUB_TOKEN}")
          fi
          RELEASE_URL="https://api.github.com/repos/${GITHUB_REPO}/releases/tags/${{ inputs.version }}"

          echo "🌐 Checking release: $RELEASE_URL"

          check_release() {
            curl -s -fL "$1" -o /dev/null -w "%{http_code}" "$RELEASE_URL" | grep -q "^200$"
          }

          if check_release "${AUTH_HEADER[@]}"; then
            echo "✅ Version ${{ inputs.version }} exists and is accessible"
          elif [ "${#AUTH_HEADER[@]}" -gt 0 ] && check_release; then
            echo "✅ Version ${{ inputs.version }} exists (authenticated check was IP-blocked; tokenless check passed)"
          else
            echo "❌ Version ${{ inputs.version }} does not exist or is not accessible!"
            echo ""
            echo "📦 Latest available versions for $GITHUB_REPO:"

            # Get latest 3 versions for suggestion
            LATEST_VERSIONS=$(curl -sL "${AUTH_HEADER[@]}" "https://api.github.com/repos/${GITHUB_REPO}/releases?per_page=3" | grep -o '"tag_name": *"[^"]*"' | sed 's/"tag_name": *"\([^"]*\)"/\1/' 2>/dev/null || echo "Could not fetch versions")

            if [ -n "$LATEST_VERSIONS" ] && [ "$LATEST_VERSIONS" != "Could not fetch versions" ]; then
              echo "$LATEST_VERSIONS" | while read -r version; do
                echo "  - $version"
              done
            else
              echo "  Check https://github.com/${GITHUB_REPO}/releases for available versions"
            fi

            echo ""
            echo "💡 Please use a valid version and retry the build."
            echo "   Current requested: ${{ inputs.version }}"
            echo ""
            exit 1
          fi
        fi

    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y tar gzip jq curl lintian parallel dpkg-dev gettext-base

        # Install mikefarah/yq (Go-based, not Python yq from apt). The runner
        # can be amd64 (ubuntu-latest) or arm64 (ubuntu-24.04-arm), so download
        # the matching binary - a hardcoded amd64 build fails with "Exec format
        # error" on native arm64 runners.
        YQ_VERSION="v4.48.1"
        case "$(uname -m)" in
          x86_64|amd64) YQ_ARCH="amd64" ;;
          aarch64|arm64) YQ_ARCH="arm64" ;;
          armv7l|armv6l) YQ_ARCH="arm" ;;
          i386|i686) YQ_ARCH="386" ;;
          ppc64le) YQ_ARCH="ppc64le" ;;
          s390x) YQ_ARCH="s390x" ;;
          *) echo "⚠️ Unknown runner arch $(uname -m); falling back to amd64 yq" >&2; YQ_ARCH="amd64" ;;
        esac
        sudo curl -fsSL -o /usr/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_${YQ_ARCH}"
        sudo chmod +x /usr/bin/yq

    - name: Validate configuration
      shell: bash
      run: |
        if [ ! -f "${{ inputs.config-file }}" ]; then
          echo "Error: Configuration file not found: ${{ inputs.config-file }}"
          exit 1
        fi
        echo "Configuration file found: ${{ inputs.config-file }}"

    - name: Set up QEMU for cross-architecture builds
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64,arm,i386,ppc64le,s390x,riscv64

    - name: Build packages
      id: build
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
        VERSION: ${{ inputs.version }}
        BUILD_VERSION: ${{ inputs.build-version }}
        ARCHITECTURE: ${{ inputs.architecture }}
        MAX_PARALLEL: ${{ inputs.max-parallel }}
        LINTIAN_CHECK: ${{ inputs.lintian-check }}
        TELEMETRY_ENABLED: ${{ inputs.telemetry-enabled }}
        SAVE_BASELINE: ${{ inputs.save-baseline }}
        PINNED_METADATA: ${{ inputs.pinned-metadata }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        echo "Starting multi-architecture build..."
        echo "Config: $CONFIG_FILE"
        echo "Version: $VERSION"
        echo "Build Version: $BUILD_VERSION"
        echo "Architecture: $ARCHITECTURE"

        # Copy build infrastructure from action to working directory
        # Skip if action is already running from the workspace (uses: ./)
        if [ "$(realpath "$ACTION_PATH")" != "$(realpath .)" ]; then
          cp -r "$ACTION_PATH/src" ./src
          cp -r "$ACTION_PATH/templates" ./templates
          cp "$ACTION_PATH/build.sh" ./build.sh
          cp "$ACTION_PATH/Dockerfile" ./src/Dockerfile
        fi
        chmod +x ./build.sh ./src/main.sh ./src/lib/*.sh

        # Ensure package template files are in output/ for Docker build context
        if [ ! -d "./output" ]; then
          cp -r "$ACTION_PATH/templates/output" ./output
        fi

        # Diagnostic: log docker/buildx state before builds so runner failures are visible
        echo "--- docker info ---"
        docker info --format '{{.ServerVersion}}' 2>&1 || echo "docker daemon unreachable"
        echo "--- qemu/binfmt registrations ---"
        ls /proc/sys/fs/binfmt_misc/ 2>/dev/null
        echo "--- docker buildx version ---"
        docker buildx version 2>&1 || echo "buildx unavailable"

        # Run the build
        ./build.sh "$CONFIG_FILE" "$VERSION" "$BUILD_VERSION" "$ARCHITECTURE"

        # Collect generated packages
        PACKAGES=$(ls *.deb 2>/dev/null | tr '\n' ' ' || echo "")
        echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
        echo "Generated packages: $PACKAGES"
        SOURCE_PACKAGES=$(ls *.dsc 2>/dev/null | tr '\n' ' ' || echo "")
        echo "Generated source packages: $SOURCE_PACKAGES"
