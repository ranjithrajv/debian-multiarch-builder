# System Constants and Debian/Ubuntu Official Policies
# These are universal facts that rarely change
# DO NOT modify unless Debian or Ubuntu releases new versions or changes
# official policies

metadata:
  last_updated: "2026-09-04"
  source: "https://wiki.debian.org/SupportedArchitectures"
  source_ubuntu: "https://wiki.ubuntu.com/Releases"
  note: "Update when new Debian or Ubuntu versions are released"

# Valid distributions. Suite codenames are the single identifier everywhere -
# Debian and Ubuntu codenames never collide, so nothing needs to name a
# vendor. A suite without base_image builds on debian:<suite>; Ubuntu suites
# set it explicitly. See base_image_for() in lib/config.sh.
distributions:
  valid:
    - bullseye  # Debian 11 (oldoldstable)
    - bookworm  # Debian 12 (stable)
    - trixie    # Debian 13 (testing)
    - forky     # Debian 14 (future)
    - sid       # Debian unstable
    - jammy     # Ubuntu 22.04 LTS
    - noble     # Ubuntu 24.04 LTS
    - questing  # Ubuntu 25.10 (interim)
    - resolute  # Ubuntu 26.04 LTS

  details:
    bullseye:
      version: "11"
      status: oldoldstable
      release_date: "2021-08-14"
      security_support_ends: "2024-08-14"
      lts_support_ends: "2026-08-31"

    bookworm:
      version: "12"
      status: oldstable
      release_date: "2023-06-10"
      security_support_ends: "2026-06-10"
      lts_support_ends: "2028-06-30"

    trixie:
      version: "13"
      status: stable
      release_date: "2025-08-09"
      security_support_ends: "2028-08-09"
      lts_support_ends: "2030-06-30"

    forky:
      version: "14"
      status: testing
      release_date: null  # Not yet released
      security_support_ends: null
      lts_support_ends: null

    sid:
      version: "unstable"
      status: perpetual
      release_date: null  # Rolling release
      security_support_ends: null
      lts_support_ends: null

    # Ubuntu suites. lts_support_ends carries Ubuntu's END OF STANDARD
    # SUPPORT (not ESM/Pro, which is a paid extension) so that
    # filter_expired_distributions() applies one rule to both vendors.
    # `architectures` is an explicit allowlist: Ubuntu's port set is
    # narrower than Debian's - no i386 as a full port since 18.04, no
    # armel, no loong64 - and without it the universal list in
    # architecture_support would wrongly admit all three.
    jammy:
      version: "22.04"
      status: lts
      release_date: "2022-04-21"
      security_support_ends: "2027-04-30"
      lts_support_ends: "2027-04-30"
      base_image: "ubuntu:jammy"
      architectures: [amd64, arm64, armhf, ppc64el, riscv64, s390x]

    noble:
      version: "24.04"
      status: lts
      release_date: "2024-04-25"
      security_support_ends: "2029-04-30"
      lts_support_ends: "2029-04-30"
      base_image: "ubuntu:noble"
      architectures: [amd64, arm64, armhf, ppc64el, riscv64, s390x]

    questing:
      version: "25.10"
      status: interim
      release_date: "2025-10-09"
      security_support_ends: "2026-07-09"
      lts_support_ends: "2026-07-09"  # 9-month interim; already expired
      base_image: "ubuntu:questing"
      architectures: [amd64, arm64, armhf, ppc64el, riscv64, s390x]

    resolute:
      version: "26.04"
      status: lts
      release_date: "2026-04-23"
      security_support_ends: "2031-04-30"
      lts_support_ends: "2031-04-30"
      base_image: "ubuntu:resolute"
      architectures: [amd64, arm64, armhf, ppc64el, riscv64, s390x]

# Architecture Support Matrix (Debian)
# Ubuntu suites bypass this via details.<suite>.architectures above.
# Official Debian policies - applied automatically
architecture_support:
  # Universal architectures (all distributions)
  universal:
    - amd64
    - arm64
    - armhf
    - ppc64el
    - s390x
    - riscv64
    - loong64

  # Distribution-restricted architectures
  restricted:
    i386:
      distributions:
        - bullseye
        - bookworm
        - trixie
      reason: "Reduced support in Trixie v13+ (partial userland only)"
      note: "Full installation support only in Bullseye/Bookworm, partial userland in Trixie+"

    armel:
      distributions:
        - bullseye
        - bookworm
        - trixie
      reason: "Limited security support in Trixie v13+ (glibc maintenance issues)"
      note: "Security fixes may be delayed due to limited maintainer support"

    riscv64:
      distributions:
        - trixie
        - forky
        - sid
      reason: "Introduced in Trixie (v13)"
      note: "Not available in Bookworm"

    loong64:
      distributions:
        - forky
        - sid
      reason: "Introduced in Forky (v14)"
      note: "Not available in Bookworm or Trixie"

# Architecture naming patterns for auto-discovery
# Maps Debian architectures to common upstream naming conventions
# These are industry-standard patterns
arch_patterns:
  amd64: "x86_64|amd64|x64"
  arm64: "aarch64|arm64"
  armel: "arm-|armeabi"
  armhf: "armv7|armhf|arm-.*gnueabihf"
  i386: "i686|i386|x86"
  ppc64el: "powerpc64le|ppc64le"
  s390x: "s390x"
  riscv64: "riscv64gc|riscv64"
  loong64: "loongarch64|loong64"

# Supported artifact formats
# These are the archive formats the builder can extract
supported_formats:
  - tar.gz
  - tgz
  - zip
