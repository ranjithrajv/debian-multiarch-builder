# System Constants and Debian Official Policies
# These are universal facts that rarely change
# DO NOT modify unless Debian releases new versions or changes official policies

metadata:
  last_updated: "2025-01-17"
  source: "https://wiki.debian.org/SupportedArchitectures"
  note: "Update when new Debian versions are released"

# Valid Debian distributions
distributions:
  valid:
    - bullseye  # Debian 11 (oldoldstable)
    - bookworm  # Debian 12 (stable)
    - trixie    # Debian 13 (testing)
    - forky     # Debian 14 (future)
    - sid       # Debian unstable

  details:
    bullseye:
      version: "11"
      status: oldoldstable
      release_date: "2021-08-14"
      security_support_ends: "2024-08-14"
      lts_support_ends: "2026-08-31"

    bookworm:
      version: "12"
      status: oldstable
      release_date: "2023-06-10"
      security_support_ends: "2026-06-10"
      lts_support_ends: "2028-06-30"

    trixie:
      version: "13"
      status: stable
      release_date: "2025-08-09"
      security_support_ends: "2028-08-09"
      lts_support_ends: "2030-06-30"

    forky:
      version: "14"
      status: testing
      release_date: null  # Not yet released
      security_support_ends: null
      lts_support_ends: null

    sid:
      version: "unstable"
      status: perpetual
      release_date: null  # Rolling release
      security_support_ends: null
      lts_support_ends: null

    # Ubuntu suites (opt-in native builds via a package.yaml
    # `ubuntu_distributions` key), kept in `details` so
    # filter_expired_distributions() applies to them too: the interim
    # questing (EOL 2026-07-01) is dropped from native builds automatically
    # and is served by the apt-repo's alias fallback instead.
    # Standard-support (non-ESM) dates from endoflife.date/ubuntu.
    jammy:
      version: "22.04"
      status: "LTS"
      release_date: "2022-04-21"
      lts_support_ends: "2027-04-30"

    noble:
      version: "24.04"
      status: "LTS"
      release_date: "2024-04-25"
      lts_support_ends: "2029-05-30"

    questing:
      version: "25.10"
      status: interim
      release_date: "2025-10-09"
      lts_support_ends: "2026-07-01"

    resolute:
      version: "26.04"
      status: "LTS"
      release_date: "2026-04-23"
      lts_support_ends: "2031-04-30"

# Debian Architecture Support Matrix
# Official Debian policies - applied automatically
architecture_support:
  # Universal architectures (all distributions)
  universal:
    - amd64
    - arm64
    - armhf
    - ppc64el
    - s390x
    - riscv64
    - loong64

  # Distribution-restricted architectures
  restricted:
    i386:
      distributions:
        - bullseye
        - bookworm
        - trixie
      reason: "Reduced support in Trixie v13+ (partial userland only)"
      note: "Full installation support only in Bullseye/Bookworm, partial userland in Trixie+"

    armel:
      distributions:
        - bullseye
        - bookworm
        - trixie
      reason: "Limited security support in Trixie v13+ (glibc maintenance issues)"
      note: "Security fixes may be delayed due to limited maintainer support"

    riscv64:
      distributions:
        - trixie
        - forky
        - sid
      reason: "Introduced in Trixie (v13)"
      note: "Not available in Bookworm"

    loong64:
      distributions:
        - forky
        - sid
      reason: "Introduced in Forky (v14)"
      note: "Not available in Bookworm or Trixie"

# Architecture naming patterns for auto-discovery
# Maps Debian architectures to common upstream naming conventions
# These are industry-standard patterns
arch_patterns:
  amd64: "x86_64|amd64|x64"
  arm64: "aarch64|arm64"
  armel: "arm-|armeabi"
  armhf: "armv7|armhf|arm-.*gnueabihf"
  i386: "i686|i386|x86"
  ppc64el: "powerpc64le|ppc64le"
  s390x: "s390x"
  riscv64: "riscv64gc|riscv64"
  loong64: "loongarch64|loong64"

# Supported artifact formats
# These are the archive formats the builder can extract
supported_formats:
  - tar.gz
  - tgz
  - zip
