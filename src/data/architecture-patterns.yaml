# Architecture naming patterns for auto-discovery
# Maps Debian architectures to common upstream naming conventions
# These are industry-standard patterns

architecture_patterns:
  amd64: "x86_64|amd64|x64"
  arm64: "aarch64|arm64"
  # armel is Debian's soft-float ARM port. "eabi([^h]|$)" requires the abi
  # suffix NOT be followed by "hf", so hard-float assets like
  # arm-unknown-linux-gnueabihf/musleabihf (which belong to armhf) are
  # excluded - matching them here would ship an ABI-incompatible binary.
  armel: "armel|armeabi([^h]|$)|arm-.*eabi([^h]|$)"
  armhf: "armv7|armhf|arm-.*gnueabihf"
  # "x86" alone would also match "x86_64" (amd64) as a substring, so require
  # it NOT be followed by "_" (excludes "x86_64" while still matching a bare
  # "x86" token like lazygit's "..._linux_32-bit" sibling naming does not
  # need this alternative, but other upstreams' plain "x86" asset names do).
  i386: "i686|i386|x86[^_]|x86$|32-bit"
  ppc64el: "powerpc64le|ppc64le"
  s390x: "s390x"
  riscv64: "riscv64gc|riscv64"
  loong64: "loongarch64|loong64"

# Auto-discovery preferences - order of preference for build types
auto_discovery_preferences:
  # Most users prefer gnu builds (native to Debian) over musl
  - "gnu"
  - "musl"
  - "linux"

# Exclude patterns when filtering release assets
exclude_patterns:
  - "sha256"
  - "checksum"
  - "source"