# Valid Debian distributions
# Contains information about Debian releases and their characteristics

distributions:
  valid:
    - bullseye    # Debian 11 (oldoldstable)
    - bookworm    # Debian 12 (stable)
    - trixie      # Debian 13 (testing)
    - forky       # Debian 14 (future)
    - sid         # Debian unstable

  details:
    bullseye:
      version: "11"
      status: oldoldstable
      release_date: "2021-08-14"
      security_support_ends: "2024-08-14"
      lts_support_ends: "2026-08-31"
      description: "Debian 11 (oldoldstable, LTS)"

    bookworm:
      version: "12"
      status: oldstable
      release_date: "2023-06-10"
      security_support_ends: "2026-06-10"
      lts_support_ends: "2028-06-30"
      description: "Debian 12 (stable)"

    trixie:
      version: "13"
      status: stable
      release_date: "2025-08-09"
      security_support_ends: "2028-08-09"
      lts_support_ends: "2030-06-30"
      description: "Debian 13 (stable)"

    forky:
      version: "14"
      status: testing
      release_date: null  # Not yet released
      security_support_ends: null
      lts_support_ends: null
      description: "Debian 14 (future)"

    sid:
      version: "unstable"
      status: perpetual
      release_date: null  # Rolling release
      security_support_ends: null
      lts_support_ends: null
      description: "Debian unstable (rolling)"

  # Ubuntu suites: opt-in via a package.yaml `ubuntu_distributions` key.
  # These produce NATIVE ubuntu debs (base image ubuntu:<suite>) for packages
  # that request them; packages that don't are served from the Debian suite
  # via the apt-repo's alias fallback instead. Dates are standard-support
  # (non-ESM) end dates from https://endoflife.date/ubuntu.
  ubuntu:
    jammy:
      version: "22.04"
      status: "LTS"
      release_date: "2022-04-21"
      security_support_ends: null
      lts_support_ends: "2027-04-30"
      description: "Ubuntu 22.04 LTS (Jammy Jellyfish)"

    noble:
      version: "24.04"
      status: "LTS"
      release_date: "2024-04-25"
      security_support_ends: null
      lts_support_ends: "2029-05-30"
      description: "Ubuntu 24.04 LTS (Noble Numbat)"

    questing:
      version: "25.10"
      status: interim
      release_date: "2025-10-09"
      security_support_ends: "2026-07-01"
      lts_support_ends: "2026-07-01"
      description: "Ubuntu 25.10 (Questing Quokka) - interim, EOL 2026-07"

    resolute:
      version: "26.04"
      status: "LTS"
      release_date: "2026-04-23"
      security_support_ends: null
      lts_support_ends: "2031-04-30"
      description: "Ubuntu 26.04 LTS (Resolute Raccoon)"

# Default architectures for each distribution
default_architectures:
  bullseye:
    - amd64
    - arm64
    - armel  # Last version as regular architecture
    - armhf
    - i386   # Deprecated in Trixie+
    - ppc64el
    - s390x

  bookworm:
    - amd64
    - arm64
    - armel  # Last version as regular architecture
    - armhf
    - i386   # Deprecated in Trixie+
    - ppc64el
    - s390x

  trixie:
    - amd64
    - arm64
    - armhf
    - ppc64el
    - s390x
    - riscv64  # Introduced in Trixie

  forky:
    - amd64
    - arm64
    - armhf
    - ppc64el
    - s390x
    - riscv64
    - loong64

  sid:
    - amd64
    - arm64
    - armhf
    - ppc64el
    - s390x
    - riscv64
    - loong64

  jammy:
    - amd64
    - arm64
    - armhf
    - ppc64el
    - s390x

  noble:
    - amd64
    - arm64
    - armhf
    - ppc64el
    - s390x
    - riscv64  # Ubuntu ports builds available since 24.04

  questing:
    - amd64
    - arm64
    - armhf
    - ppc64el
    - s390x
    - riscv64

  resolute:
    - amd64
    - arm64
    - armhf
    - ppc64el
    - s390x
    - riscv64